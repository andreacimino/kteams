# Builds the Flatpak on every push and pull request; the bundle (kteams.flatpak) is an
# artifact of the run, and on a "v*" tag it is attached to the GitHub release.
name: Flatpak

on:
  push:
    branches: [develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/org.kteams.kteams.yml
          bundle: kteams.flatpak
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/org.kteams.kteams.yml') }}
      - name: Attach the bundle to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: kteams.flatpak
