<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1e24"/>
      <stop offset="1" stop-color="#252b36"/>
    </linearGradient>
    <clipPath id="shot"><rect x="80" y="270" width="1040" height="650" rx="18"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#page)"/>
  <image href="../../native/data/org.kteams.kteams.svg" x="74" y="64" width="150" height="150"/>
  <text x="250" y="148" font-family="Noto Sans, sans-serif" font-size="88" font-weight="700" fill="#fcfcfc">KTeams</text>
  <text x="254" y="200" font-family="Noto Sans, sans-serif" font-size="32" fill="#c8ccd2">A native Microsoft Teams client for KDE Plasma</text>

  <rect x="80" y="270" width="1040" height="650" rx="18" fill="#202326" filter="url(#shadow)"/>
  <image href="../screenshots/chat.png" x="80" y="270" width="1040" height="650" clip-path="url(#shot)" preserveAspectRatio="xMidYMid slice"/>
  <rect x="80" y="270" width="1040" height="650" rx="18" fill="none" stroke="#3daee9" stroke-opacity="0.35" stroke-width="2"/>

  <g font-family="Noto Sans, sans-serif" text-anchor="middle">
    <rect x="80"  y="980" width="245" height="100" rx="16" fill="#2a5fd6" fill-opacity="0.18" stroke="#3daee9" stroke-opacity="0.5"/>
    <text x="202" y="1027" font-size="34" font-weight="700" fill="#3daee9">~120 MB</text>
    <text x="202" y="1060" font-size="19" fill="#c8ccd2">vs ~1 GB for Teams web</text>
    <rect x="345" y="980" width="245" height="100" rx="16" fill="#2a5fd6" fill-opacity="0.18" stroke="#3daee9" stroke-opacity="0.5"/>
    <text x="467" y="1027" font-size="34" font-weight="700" fill="#3daee9">Native</text>
    <text x="467" y="1060" font-size="19" fill="#c8ccd2">Qt 6 and Kirigami</text>
    <rect x="610" y="980" width="245" height="100" rx="16" fill="#2a5fd6" fill-opacity="0.18" stroke="#3daee9" stroke-opacity="0.5"/>
    <text x="732" y="1027" font-size="34" font-weight="700" fill="#3daee9">Calls</text>
    <text x="732" y="1060" font-size="19" fill="#c8ccd2">native audio and video</text>
    <rect x="875" y="980" width="245" height="100" rx="16" fill="#2a5fd6" fill-opacity="0.18" stroke="#3daee9" stroke-opacity="0.5"/>
    <text x="997" y="1027" font-size="34" font-weight="700" fill="#3daee9">GPL-3.0</text>
    <text x="997" y="1060" font-size="19" fill="#c8ccd2">open source</text>
  </g>
  <text x="600" y="1140" text-anchor="middle" font-family="Noto Sans Mono, monospace" font-size="28" fill="#fcfcfc" fill-opacity="0.85">github.com/andreacimino/kteams</text>
</svg>
